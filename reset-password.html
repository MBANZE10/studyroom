<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialisation du mot de passe — StudyRoom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-shell">
    <div class="login-box">
      <h2>Réinitialisation du mot de passe</h2>
      <p>Définissez un nouveau mot de passe pour votre compte.</p>
      <div id="resetMessage" class="login-message" role="alert"></div>

      <form id="resetPasswordForm" novalidate>
        <label for="resetPassword">Nouveau mot de passe</label>
        <div class="field-with-toggle">
          <input type="password" id="resetPassword" placeholder="Entrez un nouveau mot de passe" required>
          <button type="button" class="password-toggle" data-toggle-password="resetPassword" aria-label="Afficher le mot de passe">Afficher</button>
        </div>

        <label for="resetPasswordConfirm">Confirmer le mot de passe</label>
        <div class="field-with-toggle">
          <input type="password" id="resetPasswordConfirm" placeholder="Confirmez votre mot de passe" required>
          <button type="button" class="password-toggle" data-toggle-password="resetPasswordConfirm" aria-label="Afficher le mot de passe">Afficher</button>
        </div>

        <button type="submit" class="main-button">Enregistrer le nouveau mot de passe</button>
      </form>
    </div>
  </main>

  <script src="config.js?v=production-2"></script>
  <script>
    const apiBase = (window.STUDYROOM_CONFIG && typeof window.STUDYROOM_CONFIG.apiBaseUrl === 'string') ? window.STUDYROOM_CONFIG.apiBaseUrl.replace(/\/$/, '') : '';
    const resetMessage = document.getElementById('resetMessage');
    const resetForm = document.getElementById('resetPasswordForm');
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    function showResetMessage(message, type) {
      resetMessage.textContent = message;
      resetMessage.className = 'login-message';
      if (type) resetMessage.classList.add(type);
    }

    async function submitReset(event) {
      event.preventDefault();
      const password = document.getElementById('resetPassword').value;
      const confirmPassword = document.getElementById('resetPasswordConfirm').value;

      if (!password || !confirmPassword) {
        showResetMessage('Veuillez remplir les deux champs.', 'error');
        return;
      }

      if (password.length < 8) {
        showResetMessage('Le mot de passe doit contenir au moins 8 caractères.', 'error');
        return;
      }

      if (password !== confirmPassword) {
        showResetMessage('Les deux mots de passe ne correspondent pas.', 'error');
        return;
      }

      if (!token) {
        showResetMessage('Jeton de réinitialisation manquant ou invalide.', 'error');
        return;
      }

      try {
        const response = await fetch(`${apiBase}/api/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await response.json();

        if (!response.ok) {
          showResetMessage(data.message || 'Impossible de réinitialiser le mot de passe.', 'error');
          return;
        }

        showResetMessage(data.message || 'Mot de passe réinitialisé avec succès.', 'success');
        resetForm.reset();
        setTimeout(() => {
          window.location.href = './';
        }, 1400);
      } catch (error) {
        showResetMessage('Le serveur est inaccessible pour la réinitialisation.', 'error');
      }
    }

    document.querySelectorAll('[data-toggle-password]').forEach((button) => {
      button.addEventListener('click', () => {
        const field = document.getElementById(button.dataset.togglePassword);
        if (!field) return;
        const nextType = field.type === 'password' ? 'text' : 'password';
        field.type = nextType;
        button.textContent = nextType === 'password' ? 'Afficher' : 'Masquer';
      });
    });

    resetForm.addEventListener('submit', submitReset);
  </script>
</body>
</html>
